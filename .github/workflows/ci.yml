name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: smoke/**/*.gradle.kts

      - name: Validate scripts
        run: |
          bash -n \
            scripts/build-complete-runtime.sh \
            scripts/build-release.sh \
            scripts/stage-maven-publication.sh \
            scripts/verify-elf.sh \
            smoke/gradlew
          python3 -m compileall -q scripts

      - name: Test complete runtime assembly
        run: |
          python3 scripts/verify_complete_source_lock.py
          python3 -m unittest discover -s tests -v

      - name: Verify complete runtime contract
        run: |
          source config/complete-runtime.env
          reference="$RUNNER_TEMP/litert-${REFERENCE_LITERT_VERSION}.aar"
          curl -fL --retry 3 "$REFERENCE_LITERT_AAR_URL" -o "$reference"
          echo "$REFERENCE_LITERT_AAR_SHA256  $reference" | sha256sum -c -
          python3 scripts/verify-runtime-contract.py \
            --aar "$reference" \
            --contract contracts/complete-runtime-contract.json \
            --mode reference
          chmod +x smoke/gradlew
          ./smoke/gradlew -p smoke :contract:compileDebugKotlin --stacktrace

      - name: Verify complete runtime source patches
        run: |
          source config/complete-runtime.env
          source_dir="$RUNNER_TEMP/litert-source"
          git init "$source_dir"
          git -C "$source_dir" remote add origin "$LITERT_REPOSITORY"
          git -C "$source_dir" fetch \
            --depth=1 \
            --filter=blob:none \
            origin "$LITERT_COMMIT"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          python3 scripts/apply-complete-runtime-patches.py \
            --source "$source_dir" \
            --verify-only

      - name: Verify deterministic AAR packaging
        run: |
          tmp="$(mktemp -d)"
          printf 'test-runtime' > "$tmp/libLiteRt.so"
          printf 'test-jni' > "$tmp/liblitert_jni.so"
          printf 'license' > "$tmp/LICENSE"
          printf 'third-party' > "$tmp/THIRD_PARTY_LICENSES.txt"
          for output in first second; do
            python3 scripts/package_release.py \
              --runtime-library "$tmp/libLiteRt.so" \
              --jni-library "$tmp/liblitert_jni.so" \
              --source-license "$tmp/LICENSE" \
              --third-party-licenses "$tmp/THIRD_PARTY_LICENSES.txt" \
              --notices THIRD_PARTY_NOTICES.md \
              --validation-report docs/x86-validation-2.2.0-bss.1.md \
              --dist-dir "$tmp/$output" \
              --artifact-version 2.2.0-bss.1 \
              --litert-version 2.2.0 \
              --litert-commit 145c7523ff08d5e57ab5c582141775eea47da9c7 \
              --bazel-version 7.7.0 \
              --ndk-version 25.1.8937393 \
              --android-api-level 23 >/dev/null
          done
          cmp \
            "$tmp/first/litert-2.2.0-bss.1-android-x86.aar" \
            "$tmp/second/litert-2.2.0-bss.1-android-x86.aar"

      - name: Check version agreement
        run: |
          source config/release.env
          test "$(cat VERSION)" = "$ARTIFACT_VERSION"

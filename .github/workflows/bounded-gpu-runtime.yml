name: Build bounded GPU LiteRT runtime

on:
  push:
    tags: ['runtime-v*-bss.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: litert-bounded-gpu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: |
          source config/bounded-gpu-runtime.env
          test "${GITHUB_REF_NAME}" = "runtime-v${ARTIFACT_VERSION}"

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          df -h /

      - name: Run packaging and policy tests
        run: python3 -m unittest discover -s tests

      - name: Build bounded GPU runtime
        run: ./scripts/build-bounded-gpu-runtime.sh

      - name: Verify source identity
        run: |
          test "$(jq -r .repositoryCommit dist/bounded-gpu-runtime/build-manifest.json)" = \
            "${GITHUB_SHA}"

      - name: Upload independent candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bounded-gpu-runtime-${{ matrix.replica }}
          path: |
            dist/bounded-gpu-runtime/*.aar
            dist/bounded-gpu-runtime/*.json
            dist/bounded-gpu-runtime/*.txt
            dist/bounded-gpu-runtime/*.zip
            dist/bounded-gpu-runtime/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  compare-and-publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download candidate A
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v8
        with:
          name: bounded-gpu-runtime-a
          path: candidates/a

      - name: Download candidate B
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v8
        with:
          name: bounded-gpu-runtime-b
          path: candidates/b

      - name: Require byte-identical clean-runner outputs
        run: diff -rq candidates/a candidates/b

      - name: Verify release checksums
        run: |
          cd candidates/a
          sha256sum -c SHA256SUMS

      - name: Attest release binaries
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            candidates/a/*.aar
            candidates/a/*-maven.zip

      - name: Upload verified release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bounded-gpu-runtime-${{ github.sha }}
          path: candidates/a/*
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" candidates/a/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Booming SS LiteRT 2.1.5 bounded GPU runtime" \
            --notes-file docs/bounded-gpu-runtime-2.1.5-bss.2.md

name: Build complete LiteRT runtime components

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: complete-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-available-components:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BAZEL_JOBS: 4
      BSS_COMPLETE_WORK_DIR: ${{ runner.temp }}/complete-runtime-work
      BSS_COMPLETE_CACHE_DIR: ${{ runner.temp }}/complete-runtime-cache
      BSS_COMPLETE_DIST_DIR: ${{ runner.temp }}/complete-runtime-dist

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install locked Android SDK components
        run: |
          source config/complete-runtime.env
          yes | sdkmanager --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          sdkmanager \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "platforms;android-${ANDROID_COMPILE_SDK}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" \
            >> "$GITHUB_ENV"

      - name: Build source-available CPU and API components
        run: |
          chmod +x scripts/build-complete-runtime.sh
          ./scripts/build-complete-runtime.sh --available-components

      - name: Stage and consume API-only Maven fixture
        run: |
          chmod +x scripts/stage-maven-publication.sh smoke/gradlew
          ./scripts/stage-maven-publication.sh \
            --runtime-dist "${BSS_COMPLETE_DIST_DIR}" \
            --litert-source "${BSS_COMPLETE_WORK_DIR}/litert-source" \
            --output-dir "${BSS_COMPLETE_DIST_DIR}/maven-publication" \
            --allow-api-only

      - name: Upload source-available components
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: complete-runtime-components-${{ github.sha }}
          path: ${{ runner.temp }}/complete-runtime-dist/**
          if-no-files-found: error
          compression-level: 0

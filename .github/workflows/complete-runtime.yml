name: Build complete LiteRT runtime components

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: complete-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-available-components:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BAZEL_JOBS: 4
      BSS_COMPLETE_CACHE_DIR: ${{ runner.temp }}/complete-runtime-cache
      FIRST_WORK_DIR: ${{ runner.temp }}/complete-runtime-work-first
      FIRST_DIST_DIR: ${{ runner.temp }}/complete-runtime-dist-first
      SECOND_WORK_DIR: ${{ runner.temp }}/complete-runtime-work-second
      SECOND_DIST_DIR: ${{ runner.temp }}/complete-runtime-dist-second
      REPRODUCIBILITY_DIR: ${{ runner.temp }}/complete-runtime-reproducibility

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install locked Android SDK components
        run: |
          source config/complete-runtime.env
          yes | sdkmanager --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          sdkmanager \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "platforms;android-${ANDROID_COMPILE_SDK}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" \
            >> "$GITHUB_ENV"

      - name: Build first source-available candidate
        run: |
          chmod +x scripts/build-complete-runtime.sh
          BSS_COMPLETE_WORK_DIR="${FIRST_WORK_DIR}" \
          BSS_COMPLETE_DIST_DIR="${FIRST_DIST_DIR}" \
          BSS_REQUIRE_CLEAN_BUILD=1 \
            ./scripts/build-complete-runtime.sh --available-components

      - name: Stage and consume first API-only Maven fixture
        run: |
          chmod +x scripts/stage-maven-publication.sh smoke/gradlew
          ./scripts/stage-maven-publication.sh \
            --runtime-dist "${FIRST_DIST_DIR}" \
            --litert-source "${FIRST_WORK_DIR}/litert-source" \
            --output-dir "${FIRST_DIST_DIR}/maven-publication" \
            --allow-api-only

      - name: Reclaim first clean workspace
        run: |
          test "${FIRST_WORK_DIR}" = "${RUNNER_TEMP}/complete-runtime-work-first"
          rm -rf -- "${FIRST_WORK_DIR}"

      - name: Build second source-available candidate
        run: |
          BSS_COMPLETE_WORK_DIR="${SECOND_WORK_DIR}" \
          BSS_COMPLETE_DIST_DIR="${SECOND_DIST_DIR}" \
          BSS_REQUIRE_CLEAN_BUILD=1 \
            ./scripts/build-complete-runtime.sh --available-components

      - name: Stage signed second API-only Maven fixture
        run: |
          export GNUPGHOME="${RUNNER_TEMP}/complete-runtime-test-gnupg"
          install -d -m 0700 "${GNUPGHOME}"
          export MAVEN_SIGNING_PASSWORD=test-signing-password
          gpg --batch --pinentry-mode loopback \
            --passphrase "${MAVEN_SIGNING_PASSWORD}" \
            --quick-generate-key \
            "Booming SS CI test <ci@example.invalid>" rsa2048 sign 1d
          export MAVEN_SIGNING_KEY="$(
            gpg --batch --pinentry-mode loopback \
              --passphrase "${MAVEN_SIGNING_PASSWORD}" \
              --armor --export-secret-keys ci@example.invalid
          )"
          ./scripts/stage-maven-publication.sh \
            --runtime-dist "${SECOND_DIST_DIR}" \
            --litert-source "${SECOND_WORK_DIR}/litert-source" \
            --output-dir "${SECOND_DIST_DIR}/maven-publication" \
            --allow-api-only

      - name: Compare independent build and Maven trees
        run: |
          source config/complete-runtime.env
          mkdir -p "${REPRODUCIBILITY_DIR}"
          python3 scripts/compare_release_builds.py \
            --first-build-dir "${FIRST_DIST_DIR}" \
            --second-build-dir "${SECOND_DIST_DIR}" \
            --first-repository \
              "${FIRST_DIST_DIR}/maven-publication/repository" \
            --second-repository \
              "${SECOND_DIST_DIR}/maven-publication/repository" \
            --group "${MAVEN_GROUP}" \
            --artifact "${MAVEN_ARTIFACT}" \
            --version "${ARTIFACT_VERSION}" \
            --output "${REPRODUCIBILITY_DIR}/reproducibility-report.json"
          python3 scripts/assemble_maven_bundle.py \
            --repository "${SECOND_DIST_DIR}/maven-publication/repository" \
            --group "${MAVEN_GROUP}" \
            --artifact "${MAVEN_ARTIFACT}" \
            --version "${ARTIFACT_VERSION}" \
            --output "${REPRODUCIBILITY_DIR}/maven-central-bundle.zip" \
            --manifest-output \
              "${REPRODUCIBILITY_DIR}/maven-central-bundle.json" \
            --require-signatures

      - name: Upload source-available reproducibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: complete-runtime-components-${{ github.sha }}
          path: |
            ${{ env.FIRST_DIST_DIR }}/**
            ${{ env.SECOND_DIST_DIR }}/**
            ${{ env.REPRODUCIBILITY_DIR }}/**
          if-no-files-found: error
          compression-level: 0

name: Build downloadable LiteRT runtime bundles

on:
  push:
    tags: ['downloadable-runtime-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: litert-downloadable-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.3'

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install locked Android SDK components
        run: |
          source config/downloadable-api.env
          yes | sdkmanager --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          sdkmanager \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "platforms;android-${ANDROID_COMPILE_SDK}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" \
            >> "$GITHUB_ENV"

      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: |
          source config/downloadable-runtime.env
          test "${GITHUB_REF_NAME}" = "${DOWNLOADABLE_RELEASE_TAG}"

      - name: Run packaging tests
        run: python3 -m unittest discover -s tests

      - name: Build source-patched explicit split-loader API
        run: |
          chmod +x scripts/build-downloadable-api.sh
          ./scripts/build-downloadable-api.sh

      - name: Build and verify component bundles
        run: |
          python3 scripts/build_downloadable_runtime_bundles.py
          python3 scripts/verify_downloadable_runtime_bundles.py \
            --readelf "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

      - name: Upload independent candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: downloadable-runtime-${{ matrix.replica }}
          path: dist/downloadable-runtime/*
          if-no-files-found: error
          compression-level: 0

  compare-and-publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download candidate A
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v8
        with:
          name: downloadable-runtime-a
          path: candidates/a

      - name: Download candidate B
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v8
        with:
          name: downloadable-runtime-b
          path: candidates/b

      - name: Require byte-identical clean-runner outputs
        run: diff -rq candidates/a candidates/b

      - name: Verify release checksums
        run: |
          cd candidates/a
          sha256sum -c SHA256SUMS

      - name: Attest downloadable runtime assets
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            candidates/a/*.aar
            candidates/a/*.zip
            candidates/a/downloadable-runtime-index.json
            candidates/a/downloadable-runtime-contract.json
            candidates/a/downloadable-api-source-lock.json

      - name: Upload verified release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: downloadable-runtime-${{ github.sha }}
          path: candidates/a/*
          if-no-files-found: error
          compression-level: 0

      - name: Publish experimental GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" candidates/a/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "Booming SS downloadable LiteRT 2.2 runtime experiment" \
            --notes-file docs/downloadable-runtime-2.2.0-bss.1-exp.1.md
